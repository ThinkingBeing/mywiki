title: 高飞de好文笔记
description: 看到好文章，用LLM深度解读，将结果记录到这里

remote_theme: jekyll/minima

minima:
  date_format: "%Y年%m月%d日"
  social_links:
    github: ThinkingBeing

collections:
  reads:
    output: true

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true