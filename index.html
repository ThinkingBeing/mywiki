---
layout: home
title: 高飞de好文笔记
list_title: 文章列表
---

<ul class="post-list">
  {%- for post in site.reads -%}
  <li>
    <span class="post-meta">{{ post.date | date: "%Y年%m月%d日" }}</span>
    <h3>
      <a class="post-link" href="{{ post.url | relative_url }}">
        {{ post.title | escape }}
      </a>
    </h3>
    <p>{{ post.description }}</p>
  </li>
  {%- endfor -%}
</ul>
